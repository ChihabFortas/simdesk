# Publishes the interface (web/ folder) to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy interface to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
        run: |
          mkdir -p _site
          cp -r web/* _site/
          # On Pages the interface must connect to the SIM Desk server running on the shop PC
          cat > _site/config.js <<'EOF'
          window.SIMDESK = { remote: true };
          EOF
          # Firebase project config from the repository variable FIREBASE_CONFIG (optional)
          if [ -n "$FIREBASE_CONFIG" ]; then
            echo "export const firebaseConfig = $FIREBASE_CONFIG;" > _site/firebase-config.js
          fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
